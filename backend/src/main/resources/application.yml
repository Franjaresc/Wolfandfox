spring:
  application:
    name: wolfandfox
  # Local development reads the same file as docker compose. Environment variables take precedence.
  config:
    import: optional:file:../deploy/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:wolfandfox}
    username: ${POSTGRES_USER:wolfandfox}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate
  # API messages are always English, whatever the machine's locale or the Accept-Language header.
  web:
    locale: en
    locale-resolver: fixed
  # Hold JSON to what contracts/openapi.yaml declares, instead of Jackson's lenient defaults.
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
