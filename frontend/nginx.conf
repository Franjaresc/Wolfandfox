server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. A variable makes nginx resolve the name per request, not once at startup,
    # so a restarted backend with a new address is still found.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Only the API is forwarded, so Actuator stays unreachable through this port.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes such as /closures/new load the application.
    location / {
        try_files $uri /index.html;
    }
}
